<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@200..1000&display=swap');
        :root {
            --primary-color: #F4C300;
            --text-color: #FFFFFF;
            --light-text-color: #ADADAD;
            --body-color: #242529;
            --card-color: #31343A;

            /* --text-color: #000000;
            --light-text-color: #555555;
            --body-color: #F4F4F4;
            --card-color: #FFFFFF; */
        }

        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: "Nunito";
            transition: 0.3s ease;
            color: var(--text-color);
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 0 20%;
            height: 100vh;
            background-color: var(--body-color);
        }

        @media(max-width: 1440px){
            body {
                padding: 0 15%;
            } 
        }

        @media(max-width: 1024px){
            body {
                padding: 0 10%;
            } 
        }

        .nav {
            font-weight: 500;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 30px 0;
        }

        .nav-broken{
            display: none;
        }

        .logo {
            width: 200px;
        }

        .nav-links {
            display: flex;
            gap: 40px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 15px 0;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        /* Interactivity */
        .nav-links a.active {
            font-weight: 600;
            color: var(--primary-color);
            border-bottom: solid 4px var(--primary-color);
        }

        @media(max-width: 900px){
            .nav{
                display: none;
            }

            .nav-broken{
                margin: 30px 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
        }

        .card{
            background-color: var(--card-color);
            padding: 40px;
            border-radius: 15px;
        }   

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 2px 8px rgba(244, 195, 0, 0.4);
        }

        /* Scrollbar Styling */
        .scrolling::-webkit-scrollbar {
            height: 15px;
            width: 15px;
        }
        .scrolling::-webkit-scrollbar-track {
            background: var(--card-color);
            border-radius: 7px;
        }
        .scrolling::-webkit-scrollbar-thumb {
            background: var(--light-text-color);
            border-radius: 7px;
            cursor: pointer;
        }

        .layunin-figure{
            position: absolute;
            bottom: 20px;
            left: 50px;
            z-index: 1;
            width: 530px;
        }

        @media(max-width: 1440px){
            .layunin-figure{
                left: 30px;
                width: 230px;
            } 
        }

        @media(max-width: 768px){  b 
            .layunin-figure{
                display: none;
            } 
        }
        
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <nav class="nav">
        <img class="logo" src="../Img/logo-light.png" alt="">
        <div class="nav-links" id="nav-links">
            <a href="../Student/1 - Dashboard.html" class="text-lg ">Dashboard</a>
            <a href="../Student/2 - Lessons.html" class="text-lg active">Lessons</a>
            <a href="#" class="text-lg">Achievements</a>
            <a href="#" class="text-lg">Profile</a>
        </div>
    </nav>

    <nav class="nav-broken">
        <img class="logo-broken" width="60" src="../Img/logo-light-broken.png" alt="">
        <i class="fa-solid fa-bars text-2xl cursor-pointer"></i>
    </nav>

    <main class="flex-1 overflow-hidden pb-[50px]">
        <div class="h-full flex items-center justify-center">
            <img class="layunin-figure" src="../Img/layunin-figure.png" alt="Layunin Figure">
            
            <div class="card w-full flex flex-col items-center gap-5 relative text-lg max-h-[80vh]">
                
                <!-- Scrollable Content Area -->
                <div class="w-full flex-1 flex flex-col gap-6 px-2">
                    <div class="header">
                        <h1 class="text-3xl font-bold"><span class="text-[#F4C300]">Sesyon 1:</span> Ang Apabetong Filipino</h1>
                        <p class="text-2xl font-bold text-gray-300">Pagpapakilala ng mga letra at tunog ng mga ito</p>
                    </div>
                    
                    <div class="grid grid-cols-6 gap-5 text-4xl font-bold text-center">
                        <p>Aa</p>
                        <p>Bb</p>
                        <p>Cc</p>
                        <p>Dd</p>
                        <p>Ee</p>
                        <p>Ff</p>
                        <p>Gg</p>
                        <p>Hh</p>
                        <p>Ii</p>
                        <p>Jj</p>
                        <p>Kk</p>
                        <p>Ll</p>
                        <p>Mm</p>
                        <p>Nn</p>
                        <p>Oo</p>
                        <p>Pp</p>
                        <p>Qq</p>
                        <p>Rr</p>
                        <p>Ss</p>
                        <p>Tt</p>
                        <p>Yy</p>
                        <p>Vv</p>
                        <p>Ww</p>
                        <p>Xx</p>
                        <p>Yy</p>
                        <p>Zz</p>
                    </div>
                </div>
                
                <!-- Action Button -->
                <button class="w-fit self-end px-4 py-2 bg-[#F4C300] text-md text-gray-900 rounded-md font-bold mt-4">
                    Magpatuloy <i class="fa-solid fa-arrow-right text-black"></i>
                </button>
            </div>
        </div>
    </main>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
