<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BASARO — Student Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151c;
    --panel:#1c2129;
    --panel-2:#232a34;
    --card-inner:#161a21;
    --yellow:#f5b800;
    --yellow-soft:#fdf0c4;
    --text:#f4f5f7;
    --text-dim:#8b929e;
    --green:#22c58b;
    --blue:#4a9bff;
    --red:#ff5d5d;
    --orange:#f97316;
    --divider:#2a2f39;
    --row-divider:#252b34;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Poppins',sans-serif;
    background:var(--bg);
    color:var(--text);
    display:flex;
    font-size:14px;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:250px;flex-shrink:0;padding:22px 20px;
    border-right:1px solid var(--divider);height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:11px;padding-bottom:20px;border-bottom:1px solid var(--divider)}
  .brand .logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(160deg,#ffd34d,#f5b800);display:flex;align-items:center;justify-content:center;font-size:20px}
  .brand h1{font-size:21px;font-weight:800;letter-spacing:.5px}
  .menu-toggle{margin-left:auto;color:var(--text-dim);font-size:20px;cursor:pointer;user-select:none}
  .nav{margin-top:22px;display:flex;flex-direction:column;gap:7px}
  .nav a{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:13px;color:var(--text-dim);text-decoration:none;font-weight:500;transition:.15s;line-height:1.25}
  .nav a .ico{width:32px;height:32px;border-radius:9px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .nav a:hover{background:var(--panel);color:var(--text)}
  .nav a.active{background:#fff;color:#12151c;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.35)}
  .nav a.active .ico{background:var(--yellow);color:#12151c}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;height:100vh;overflow-y:auto;padding:22px 26px;display:flex;flex-direction:column}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-shrink:0}
  .crumb{color:var(--text-dim);font-size:13px}
  .crumb strong{display:block;color:var(--text);font-size:22px;font-weight:700;margin-top:2px}
  .greet{color:var(--text);font-weight:500}

  /* ---------- Table card ---------- */
  .card{background:var(--panel);border-radius:18px;padding:26px 28px;flex:1;display:flex;flex-direction:column;min-height:0}
  .card-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:8px;flex-wrap:wrap}
  .card-head h2{font-size:22px;font-weight:700}
  .head-actions{display:flex;align-items:center;gap:12px}
  .search{position:relative}
  .search input{
    background:var(--card-inner);border:1px solid var(--divider);border-radius:11px;
    padding:11px 40px 11px 16px;color:var(--text);font-family:inherit;font-size:13px;width:260px;outline:none;
  }
  .search input::placeholder{color:var(--text-dim)}
  .search input:focus{border-color:var(--yellow)}
  .search .mag{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:14px}
  .btn-add{
    background:var(--yellow);color:#12151c;border:none;border-radius:11px;
    padding:12px 20px;font-family:inherit;font-weight:600;font-size:13px;letter-spacing:.4px;cursor:pointer;white-space:nowrap;
  }
  .btn-add:hover{filter:brightness(1.05)}
  .kebab{color:var(--text-dim);font-size:20px;cursor:pointer;padding:4px 8px}

  .table-wrap{flex:1;overflow:auto;margin-top:10px}
  table{width:100%;border-collapse:collapse;min-width:900px}
  thead th{
    text-align:left;color:var(--text-dim);font-size:12px;font-weight:600;letter-spacing:.6px;
    padding:14px 16px;border-bottom:1px solid var(--divider);white-space:nowrap;
  }
  tbody td{padding:20px 16px;border-bottom:1px solid var(--row-divider);vertical-align:middle;white-space:nowrap}
  tbody tr:hover{background:var(--card-inner)}
  .id-cell{display:flex;align-items:center;gap:8px;font-weight:600}
  .copy{color:var(--text-dim);cursor:pointer;font-size:15px}
  .copy:hover{color:var(--text)}
  .name-cell{font-weight:600}
  .user-cell{color:var(--text)}
  .status{display:inline-flex;align-items:center;gap:8px;font-weight:600}
  .status .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .login-never{color:var(--text-dim);font-style:italic}
  .login-date{font-weight:600}
  .actions{display:flex;align-items:center;gap:16px}
  .actions .act{cursor:pointer;font-size:16px;background:none;border:none;padding:0}
  .act.edit{color:var(--blue)}
  .act.key{color:var(--yellow)}
  .act.del{color:var(--red)}

  /* ---------- Pagination ---------- */
  .pagination{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
  .pag-info{color:var(--text-dim);margin-right:8px;font-size:13px}
  .page-btn{
    min-width:38px;height:38px;border-radius:10px;border:none;cursor:pointer;
    font-family:inherit;font-weight:600;font-size:14px;
    background:var(--yellow-soft);color:#7a5c00;display:flex;align-items:center;justify-content:center;
  }
  .page-btn.active{background:var(--yellow);color:#12151c}
  .page-btn:hover:not(.active){filter:brightness(.97)}

  /* ---------- Bottom nav (mobile) ---------- */
  .bottom-nav{display:none}

  @media(max-width:1100px){
    body{height:auto;overflow:auto}
    .sidebar{display:none}
    .main{height:auto;padding-bottom:84px}
    .search input{width:100%}
    .head-actions{flex:1;min-width:100%}
    .search{flex:1}
    .pagination{justify-content:center}

    .bottom-nav{
      display:flex;position:fixed;bottom:0;left:0;right:0;
      background:var(--panel);border-top:1px solid var(--divider);
      padding:10px 8px;justify-content:space-around;align-items:center;z-index:50;
      box-shadow:0 -6px 20px rgba(0,0,0,.35);
    }
    .bottom-nav a{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:12px;color:var(--text-dim);text-decoration:none;font-size:20px;transition:.15s}
    .bottom-nav a:active{background:var(--panel-2)}
    .bottom-nav a.active{background:var(--yellow);color:#12151c}
  }
</style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">📖</div>
      <h1>BASARO</h1>
      <div class="menu-toggle">☰</div>
    </div>
    <nav class="nav">
      <a href="#"><span class="ico">🏠</span>Dashboard</a>
      <a href="#" class="active"><span class="ico">🎓</span>Student Management</a>
      <a href="#"><span class="ico">👤</span>Teacher Management</a>
      <a href="#"><span class="ico">⭐</span>Performance Report</a>
      <a href="#"><span class="ico">⚙️</span>Settings</a>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumb">Pages / Header<strong>Student Management</strong></div>
      <div class="greet">Hi, Iverson Guno</div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>Student List</h2>
        <div class="head-actions">
          <div class="search">
            <input type="text" placeholder="Search students...">
            <span class="mag">🔍</span>
          </div>
          <button class="btn-add">ADD NEW STUDENT</button>
          <span class="kebab">⋮</span>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>STUDENT ID</th>
              <th>STUDENT NAME</th>
              <th>USERNAME</th>
              <th>STATUS</th>
              <th>LAST LOGIN</th>
              <th>ACTION</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <div class="pagination">
        <span class="pag-info">Showing 1 to 8 of 114 results</span>
        <button class="page-btn active">1</button>
        <button class="page-btn">2</button>
        <button class="page-btn">3</button>
        <button class="page-btn">4</button>
        <button class="page-btn">5</button>
        <button class="page-btn">▶</button>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="#" title="Dashboard">🏠</a>
    <a href="#" class="active" title="Student Management">🎓</a>
    <a href="#" title="Teacher Management">👤</a>
    <a href="#" title="Performance Report">⭐</a>
    <a href="#" title="Settings">⚙️</a>
  </nav>

<script>
  const students = [
    { id:'#113', name:'Dashboard Student 20', user:'dash_student20@test.com', login:null },
    { id:'#114', name:'Stuck Student',        user:'stuck@test.com',          login:'19/06/2026 04:24' },
    { id:'#109', name:'Dashboard Student 16', user:'dash_student16@test.com', login:'28/06/2026 04:24' },
    { id:'#111', name:'Dashboard Student 18', user:'dash_student18@test.com', login:'18/06/2026 04:24' },
    { id:'#112', name:'Dashboard Student 19', user:'dash_student19@test.com', login:null },
    { id:'#110', name:'Dashboard Student 17', user:'dash_student17@test.com', login:'23/06/2026 04:24' },
    { id:'#106', name:'Dashboard Student 13', user:'dash_student13@test.com', login:'21/06/2026 04:24' },
    { id:'#108', name:'Dashboard Student 15', user:'dash_student15@test.com', login:null },
  ];

  const rows = document.getElementById('rows');
  rows.innerHTML = students.map(s => `
    <tr>
      <td><div class="id-cell">${s.id}<span class="copy" title="Copy ID" onclick="navigator.clipboard && navigator.clipboard.writeText('${s.id}')">⧉</span></div></td>
      <td class="name-cell">${s.name}</td>
      <td class="user-cell">${s.user}</td>
      <td><span class="status"><span class="dot"></span>Active</span></td>
      <td>${ s.login ? `<span class="login-date">${s.login}</span>` : `<span class="login-never">Never</span>` }</td>
      <td>
        <div class="actions">
          <button class="act edit" title="Edit">✎</button>
          <button class="act key" title="Reset password">🔑</button>
          <button class="act del" title="Delete">🗑</button>
        </div>
      </td>
    </tr>
  `).join('');
</script>
</body>
</html>
